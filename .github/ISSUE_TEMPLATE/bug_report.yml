name: Bug report
description: Report a reproducible problem using fictional data
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps and expected behavior. Use fictional profile answers. Do not include phone numbers, keys, QR codes or real beneficiary data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Public demo / local Node version / browser
